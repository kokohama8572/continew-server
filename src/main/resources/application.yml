spring:
  application:
    name: continew
  jackson:
    # 명세서 6.3의 요약 응답 구조(source_ids, original_phrase 등)에 맞춰 snake_case를 씁니다.
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

continew:
  summary:
    # 하루 요약 요청 상한 (F-05-6f)
    daily-limit: 20
    # 범위 안 글이 이 수를 넘으면 기간을 줄이도록 안내 (6.2 실패·예외 처리)
    max-items: 300
    # 글이 이 수 이하면 요약하지 않고 원문 목록만 돌려줌 (F-05-2j)
    originals-only-threshold: 3
    # 묶음당 항목 수, 대화 요약 줄 수, 항목당 글자 수 상한 (F-05-2d)
    max-per-group: 5
    max-conversation-lines: 5
    max-text-length: 60
    zone: Asia/Seoul
    # structured: AI 호출 없이 구조화된 필드만으로 정리 (기본, API 키 불필요)
    # ai: AI로 요약. 아래 provider의 API 키가 필요합니다. 예) CONTINEW_SUMMARY_GENERATOR=ai
    # 어느 쪽이든 결과는 SummaryGuard 검사를 거칩니다.
    generator: structured
    ai:
      # gemini(기본) 또는 anthropic
      provider: gemini
      max-tokens: 16000
      # 20초를 넘기면 실패 처리 (6.2)
      timeout-seconds: 20
      gemini:
        # 키는 파일에 적지 않고 환경 변수 GEMINI_API_KEY에서만 읽습니다.
        api-key: ${GEMINI_API_KEY:}
        model: gemini-3.5-flash-lite
        # MINIMAL, LOW, MEDIUM, HIGH 중 하나. 비우면 모델 기본값 (기본 모델에만 적용)
        thinking-level:
        # 기본 모델이 과부하(503·429)로 두 번 실패하면 이 모델로 시도. 비우면 사용 안 함
        fallback-model: gemini-3.6-flash
      anthropic:
        model: claude-opus-5-5
        effort: medium

# 개인 메모·공유 글 원문이 서버 로그에 남지 않도록 합니다. (F-05-6c)
# 요청·응답 본문을 로그에 남기는 코드와 설정을 추가하지 않습니다.
logging:
  level:
    root: INFO
