spring:
  application:
    name: continew

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# 개인 메모·공유 글 원문이 서버 로그에 남지 않도록 기본 로그 레벨을 낮게 유지합니다. (명세서 F-05-6c)
logging:
  level:
    root: INFO
